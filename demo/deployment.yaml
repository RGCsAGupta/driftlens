apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftlens-demo
  namespace: driftlens-demo
  labels:
    app.kubernetes.io/name: driftlens-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: driftlens-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: driftlens-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: registry.k8s.io/pause@sha256:e5b941ef8f71de54dc3a13398226c269ba217d06650a21bd3afcf9d890cf1f41
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
