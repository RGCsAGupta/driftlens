openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: DriftLens scan API
  version: 0.1.0
  description: |
    Contract for the deterministic scan routes implemented by DriftLens Core.
    The application does not implement authentication or authorization. Local
    deployments rely on an operator-controlled private network; hosted access
    must remain behind the approved external access-control boundary, with the
    origin kept private.
  x-exposure-boundary:
    applicationAuthentication: none
    local: operator-controlled private network
    hosted: approved external access control with a private origin
servers:
  - url: /
    description: Same origin as the DriftLens application
security: []
paths:
  /api/source:
    get:
      operationId: getSource
      summary: Read non-secret configured source metadata
      responses:
        "200":
          description: Configured public repository and manifest path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceEnvelope"
              example:
                source:
                  manifestPath: deploy/example.yaml
                  repository: example/driftlens-manifests
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/scans:
    get:
      operationId: listScans
      summary: List newest-first scan history
      parameters:
        - in: query
          name: limit
          description: Maximum number of scans to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      responses:
        "200":
          description: Newest-first scan history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanListEnvelope"
              example:
                scans: []
        "400":
          description: The limit query parameter is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: INVALID_LIMIT
                  message: Limit is invalid.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: startScan
      summary: Persist and schedule one deterministic scan
      description: |
        The server trims leading and trailing whitespace before validating the
        ref. The normalized ref must contain no whitespace or control
        characters. Only one scan may be active in a process.
      x-max-request-body-bytes: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartScanRequest"
            example:
              ref: main
      responses:
        "202":
          description: Queued scan persisted and scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanEnvelope"
              example:
                scan:
                  completedAt: null
                  createdAt: "2026-07-31T12:00:00.000Z"
                  desired: null
                  differences: []
                  durable: true
                  error: null
                  explanation:
                    analysis: null
                    error: null
                    requestedAt: null
                    savedAt: null
                    state: NOT_REQUESTED
                  id: 196cdf62-4da8-49cb-a47c-6e717523af48
                  live: null
                  outcome: null
                  requestedRef: main
                  resolvedSha: null
                  stage: QUEUED
                  stages:
                    - at: "2026-07-31T12:00:00.000Z"
                      stage: QUEUED
                  status: QUEUED
                  target: null
                  updatedAt: "2026-07-31T12:00:00.000Z"
        "400":
          description: The body is malformed, oversized, or fails validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: INVALID_REQUEST
                  message: Request is invalid.
        "409":
          description: Another scan is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: SCAN_ACTIVE
                  message: Another scan is active.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/scans/{id}:
    get:
      operationId: getScan
      summary: Read one scan and its current state
      parameters:
        - in: path
          name: id
          required: true
          description: Scan identifier returned by the start operation.
          schema:
            type: string
            minLength: 1
          example: 196cdf62-4da8-49cb-a47c-6e717523af48
      responses:
        "200":
          description: Current scan state or terminal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanEnvelope"
              example:
                scan:
                  completedAt: "2026-07-31T12:00:02.000Z"
                  createdAt: "2026-07-31T12:00:00.000Z"
                  desired:
                    containers:
                      - image: example/app:2
                        name: app
                    replicas: 2
                  differences:
                    - desired: 2
                      field: spec.replicas
                      live: 1
                  durable: true
                  error: null
                  explanation:
                    analysis: null
                    error: null
                    requestedAt: null
                    savedAt: null
                    state: NOT_REQUESTED
                  id: 196cdf62-4da8-49cb-a47c-6e717523af48
                  live:
                    containers:
                      - image: example/app:2
                        name: app
                    replicas: 1
                  outcome: DRIFTED
                  requestedRef: main
                  resolvedSha: 0123456789abcdef0123456789abcdef01234567
                  stage: COMPLETED
                  stages:
                    - at: "2026-07-31T12:00:00.000Z"
                      stage: QUEUED
                    - at: "2026-07-31T12:00:02.000Z"
                      stage: COMPLETED
                  status: COMPLETED
                  target:
                    apiVersion: apps/v1
                    kind: Deployment
                    name: example
                    namespace: demo
                  updatedAt: "2026-07-31T12:00:02.000Z"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: SCAN_NOT_FOUND
                  message: Scan was not found.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/scans/{id}/explanation:
    post:
      operationId: explainScan
      summary: Manually request structured AI analysis for a completed scan
      description: |
        Makes at most one provider call. A saved explanation is returned
        idempotently. Requested and failed states are terminal and cannot be
        retried. AI never changes deterministic scan truth.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scan with a saved or safely failed explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanEnvelope"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Scan is not completed or explanation is terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  responses:
    InternalError:
      description: Unexpected internal failure with a safe public message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INTERNAL_ERROR
              message: Scan failed unexpectedly.
    ServiceUnavailable:
      description: Configuration or scan-history storage is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            configuration:
              value:
                error:
                  code: CONFIGURATION_INVALID
                  message: Scan service configuration is invalid.
            storage:
              value:
                error:
                  code: STORAGE_UNAVAILABLE
                  message: Scan history storage is unavailable.
  schemas:
    StartScanRequest:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref:
          type: string
          pattern: '^\s*[^\s\x00-\x1F\x7F](?:[^\s\x00-\x1F\x7F]{0,198}[^\s\x00-\x1F\x7F])?\s*$'
          description: |
            Branch name or commit SHA. The server trims leading and trailing
            whitespace, then rejects normalized refs containing whitespace or
            control characters.
          x-server-normalization: trim
          x-normalized-min-length: 1
          x-normalized-max-length: 200
    SourceEnvelope:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/SourceMetadata"
    SourceMetadata:
      type: object
      additionalProperties: false
      required: [manifestPath, repository]
      properties:
        manifestPath:
          type: string
        repository:
          type: string
    ScanListEnvelope:
      type: object
      additionalProperties: false
      required: [scans]
      properties:
        scans:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ScanRecord"
    ScanEnvelope:
      type: object
      additionalProperties: false
      required: [scan]
      properties:
        scan:
          $ref: "#/components/schemas/ScanRecord"
    ScanRecord:
      type: object
      additionalProperties: false
      required:
        - completedAt
        - createdAt
        - desired
        - differences
        - durable
        - error
        - explanation
        - id
        - live
        - outcome
        - requestedRef
        - resolvedSha
        - stage
        - stages
        - status
        - target
        - updatedAt
      properties:
        completedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        desired:
          oneOf:
            - $ref: "#/components/schemas/DeploymentProjection"
            - type: "null"
        differences:
          type: array
          items:
            $ref: "#/components/schemas/Difference"
        durable:
          type: boolean
          description: Whether the represented state was persisted.
        error:
          oneOf:
            - $ref: "#/components/schemas/ScanExecutionError"
            - type: "null"
        explanation:
          $ref: "#/components/schemas/ExplanationRecord"
        id:
          type: string
          format: uuid
        live:
          oneOf:
            - $ref: "#/components/schemas/DeploymentProjection"
            - type: "null"
        outcome:
          oneOf:
            - $ref: "#/components/schemas/ComparisonOutcome"
            - type: "null"
        requestedRef:
          type: string
          minLength: 1
          maxLength: 200
        resolvedSha:
          type: [string, "null"]
          pattern: "^[0-9a-f]{40}$"
        stage:
          $ref: "#/components/schemas/ScanStage"
        stages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StageRecord"
        status:
          $ref: "#/components/schemas/ScanStatus"
        target:
          oneOf:
            - $ref: "#/components/schemas/DeploymentTarget"
            - type: "null"
        updatedAt:
          type: string
          format: date-time
    DeploymentTarget:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, name, namespace]
      properties:
        apiVersion:
          const: apps/v1
        kind:
          const: Deployment
        name:
          type: string
        namespace:
          type: string
    DeploymentProjection:
      type: object
      additionalProperties: false
      required: [containers, replicas]
      properties:
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerProjection"
        replicas:
          type: integer
    ContainerProjection:
      type: object
      additionalProperties: false
      required: [image, name]
      properties:
        image:
          type: string
        name:
          type: string
    Difference:
      type: object
      additionalProperties: false
      required: [desired, field, live]
      properties:
        desired:
          oneOf:
            - type: integer
            - type: string
        field:
          type: string
        live:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
    StageRecord:
      type: object
      additionalProperties: false
      required: [at, stage]
      properties:
        at:
          type: string
          format: date-time
        stage:
          $ref: "#/components/schemas/ScanStage"
    ScanStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED]
    ScanStage:
      type: string
      enum:
        - QUEUED
        - LOADING_DESIRED
        - READING_LIVE
        - COMPARING
        - SAVING_RESULT
        - COMPLETED
        - FAILED
    ComparisonOutcome:
      type: string
      enum: [IN_SYNC, DRIFTED, MISSING_LIVE]
    ExplanationRecord:
      type: object
      additionalProperties: false
      required: [analysis, error, requestedAt, savedAt, state]
      properties:
        analysis:
          oneOf:
            - $ref: "#/components/schemas/OperatorAnalysis"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ExplanationError"
            - type: "null"
        requestedAt:
          type: [string, "null"]
          format: date-time
        savedAt:
          type: [string, "null"]
          format: date-time
        state:
          type: string
          enum: [NOT_REQUESTED, REQUESTED, SAVED, FAILED]
    OperatorAnalysis:
      type: object
      additionalProperties: false
      required:
        [
          summary,
          importantDifferences,
          likelyImplications,
          investigationChecks,
          limitations,
        ]
      properties:
        summary: { type: string, minLength: 1, maxLength: 1000 }
        importantDifferences:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 500 }
        likelyImplications:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 500 }
        investigationChecks:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 500 }
        limitations:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 500 }
    ExplanationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [
              AI_CONFIGURATION_INVALID,
              AI_INCOMPLETE,
              AI_INVALID_RESPONSE,
              AI_PROVIDER_UNAVAILABLE,
              AI_REFUSED,
              AI_TIMEOUT,
            ]
        message:
          type: string
    ScanExecutionError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ScanErrorCode"
        message:
          type: string
          description: Stable public-safe message without upstream details.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
          description: Stable public-safe message without upstream details.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiErrorCode:
      type: string
      enum:
        - CONFIGURATION_INVALID
        - EXPLANATION_NOT_ELIGIBLE
        - EXPLANATION_TERMINAL
        - INTERNAL_ERROR
        - INVALID_LIMIT
        - INVALID_REQUEST
        - SCAN_ACTIVE
        - SCAN_NOT_FOUND
        - STORAGE_UNAVAILABLE
        - STORAGE_WRITE_FAILED
    ScanErrorCode:
      type: string
      enum:
        - CONFIGURATION_INVALID
        - EXPLANATION_NOT_ELIGIBLE
        - EXPLANATION_TERMINAL
        - GITHUB_FILE_NOT_FOUND
        - GITHUB_REF_NOT_FOUND
        - GITHUB_RESPONSE_INVALID
        - GITHUB_TIMEOUT
        - GITHUB_UNAVAILABLE
        - INTERNAL_ERROR
        - KUBERNETES_FORBIDDEN
        - KUBERNETES_TIMEOUT
        - KUBERNETES_UNAVAILABLE
        - MANIFEST_INVALID
        - MANIFEST_UNSUPPORTED
        - SCAN_ACTIVE
        - SCAN_NOT_FOUND
        - STORAGE_UNAVAILABLE
        - STORAGE_WRITE_FAILED
